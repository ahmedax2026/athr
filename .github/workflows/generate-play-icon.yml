name: Generate Google Play icon from original father photo
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/generate-play-icon.yml'
jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Generate exact-photo icon
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont, ImageOps
          import os
          S=512
          im=Image.new('RGB',(S,S),(4,48,40))
          d=ImageDraw.Draw(im)
          for y in range(S):
              t=y/S
              d.line((0,y,S,y),fill=(int(4+8*t),int(58-21*t),int(48-12*t)))
          gold=(221,181,102)
          d.rounded_rectangle((12,12,500,500),radius=66,outline=gold,width=7)
          d.rounded_rectangle((24,24,488,488),radius=58,outline=(100,83,49),width=2)
          photo=Image.open('assets/images/father.jpg').convert('RGB')
          # Original photograph, no text, no alterations to facial features.
          photo=ImageOps.contain(photo,(512,512),method=Image.Resampling.LANCZOS)
          bg=Image.new('RGB',(512,512),(4,48,40))
          bg.paste(photo,((512-photo.width)//2,(512-photo.height)//2))
          im=bg
          os.makedirs('assets/store',exist_ok=True)
          im.save('assets/store/play_icon_512.png',optimize=True)
          PY
      - name: Commit generated icon
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/store/play_icon_512.png
          git diff --cached --quiet || (git commit -m "Add Google Play icon with original father photo" && git push)
