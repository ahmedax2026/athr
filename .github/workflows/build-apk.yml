name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Bundle verified Quran text for offline use
        run: python3 tool/bundle_quran.py

      - name: Bundle printed Madinah mushaf pages for offline reading
        run: |
          python3 -m pip install --quiet cairosvg Pillow
          python3 tool/bundle_mushaf.py

      - name: Set up Node.js for offline React Quran
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bundle React Quran for offline use
        run: |
          cd react_quran
          npm install --legacy-peer-deps --no-audit --no-fund
          npm run build
          python3 ../tool/inline_react_quran.py
          test -s ../assets/react_quran/index.html
          grep -q 'quran-font_react-quran' ../assets/react_quran/index.html
          grep -q 'data:font' ../assets/react_quran/index.html

      - name: Get dependencies
        run: flutter pub get

      - name: Generate Android launcher icon
        run: |
          python3 -m pip install --quiet Pillow
          python3 tool/generate_launcher_icon.py

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build installable debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: athr-android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
