name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/mushaf-library-eye-comfort

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Bundle verified Quran text for offline use
        run: python3 tool/bundle_quran.py

      - name: Bundle Quran surah-to-page index (no page images)
        run: python3 tool/bundle_mushaf.py

      - name: Generate styled offline adhkar images
        run: |
          python3 -m pip install --quiet Pillow
          python3 tool/bundle_azkar_cards.py

      - name: Bundle attributed adhan audio samples
        run: python3 tool/bundle_adhan_audio.py

      - name: Install complete adhan recordings for native background playback
        run: python3 tool/install_adhan_android.py

      - name: Get dependencies
        run: flutter pub get

      - name: Generate Android launcher icon
        run: |
          python3 -m pip install --quiet Pillow
          python3 tool/generate_launcher_icon.py

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build installable debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: athr-android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
