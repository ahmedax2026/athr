name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/qcf-lite-from-stable
      - feature/qcf-quran-005
      - feature/super-admin-from-verified-43547502262
      - feature/performance-from-43552005755
      - feature/unified-admin-release
      - feature/unified-verified-upgrades

concurrency:
  group: athr-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Bundle verified Quran text for offline use
        run: python3 tool/bundle_quran.py

      - name: Bundle Quran surah-to-page index (no page images)
        run: python3 tool/bundle_mushaf.py

      - name: Rebuild adhkar image index from approved uploaded files
        run: python3 tool/sync_azkar_manifest.py

      - name: Convert adhkar assets to verified lossless WebP
        run: |
          python3 -m pip install --quiet Pillow
          python3 tool/normalize_azkar_images.py

      - name: Optimize build-only assets and validate audio duration
        run: |
          command -v ffmpeg >/dev/null || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          python3 tool/optimize_build_assets.py

      - name: Verify every adhkar entry has an offline image
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('tool/azkar_data.json').read_text(encoding='utf-8'))
          manifest = json.loads(Path('assets/azkar/manifest.json').read_text(encoding='utf-8'))
          assert len(data) == len(manifest), 'Adhkar group count mismatch'
          for group, images in zip(data, manifest):
              assert len(group['items']) == len(images), 'Missing adhkar images'
              for filename in images:
                  assert (Path('assets/azkar') / filename).stat().st_size > 1000, filename
          print('Verified every adhkar entry maps to a real offline image')
          PY

      - name: Install complete adhan recordings for native background playback
        run: python3 tool/install_adhan_android.py

      - name: Get dependencies
        run: flutter pub get

      - name: Install Android NDK with retries
        run: |
          set -euo pipefail
          NDK_VERSION="28.2.13676358"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          for attempt in 1 2 3; do
            echo "Installing NDK $NDK_VERSION (attempt $attempt/3)"
            yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" "ndk;$NDK_VERSION" || true
            if test -f "$SDK_ROOT/ndk/$NDK_VERSION/source.properties"; then
              echo "Android NDK installed and verified"
              exit 0
            fi
            rm -rf "$SDK_ROOT/ndk/$NDK_VERSION"
            sleep 3
          done
          echo "NDK installation failed after three attempts" >&2
          exit 1

      - name: Generate Android launcher icon
        run: |
          python3 -m pip install --quiet Pillow
          python3 tool/generate_launcher_icon.py

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build signed release APK for local device testing
        env:
          ATHR_LOCAL_TEST_SIGNING: 'true'
        run: flutter build apk --release --target-platform android-arm,android-arm64,android-x64

      - name: Verify APK signature and ABI before publishing
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          APKSIGNER=$(find "$SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          python3 -c 'import zipfile; z=zipfile.ZipFile("build/app/outputs/flutter-apk/app-release.apk"); assert z.testzip() is None; assert "lib/arm64-v8a/libflutter.so" in z.namelist(); assert all("lib/"+abi+"/libapp.so" in z.namelist() for abi in ["armeabi-v7a","arm64-v8a","x86_64"])'

      - name: Upload performance release APK
        uses: actions/upload-artifact@v4
        with:
          name: athr-unified-universal-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

