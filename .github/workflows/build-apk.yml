name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/qcf-lite-from-stable
      - feature/qcf-quran-005

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Bundle verified Quran text for offline use
        run: python3 tool/bundle_quran.py

      - name: Bundle Quran surah-to-page index (no page images)
        run: python3 tool/bundle_mushaf.py

      - name: Generate styled offline adhkar images
        run: |
          python3 -m pip install --quiet Pillow
          python3 tool/bundle_azkar_cards.py

      - name: Save generated adhkar images in the repository
        if: github.ref == 'refs/heads/feature/qcf-quran-005'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -f assets/azkar_vip/
          if ! git diff --cached --quiet; then
            git commit -m "Save generated offline adhkar cards [skip ci]"
            git push origin HEAD:feature/qcf-quran-005
          fi

      - name: Verify every adhkar entry has an offline image
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('tool/azkar_data.json').read_text(encoding='utf-8'))
          manifest = json.loads(Path('assets/azkar_vip/manifest.json').read_text(encoding='utf-8'))
          assert len(data) == len(manifest), 'Adhkar group count mismatch'
          for group, images in zip(data, manifest):
              assert len(group['items']) == len(images), 'Missing adhkar images'
              for filename in images:
                  assert (Path('assets/azkar') / filename).stat().st_size > 1000, filename
          print('Verified every adhkar entry maps to a real offline image')
          PY

      - name: Upload adhkar images for visual review
        uses: actions/upload-artifact@v4
        with:
          name: athr-azkar-images
          path: assets/azkar_vip/
          if-no-files-found: error
          retention-days: 14

      - name: Install complete adhan recordings for native background playback
        run: python3 tool/install_adhan_android.py

      - name: Get dependencies
        run: flutter pub get

      - name: Install Android NDK with retries
        run: |
          set -euo pipefail
          NDK_VERSION="28.2.13676358"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          for attempt in 1 2 3; do
            echo "Installing NDK $NDK_VERSION (attempt $attempt/3)"
            yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" "ndk;$NDK_VERSION" || true
            if test -f "$SDK_ROOT/ndk/$NDK_VERSION/source.properties"; then
              echo "Android NDK installed and verified"
              exit 0
            fi
            rm -rf "$SDK_ROOT/ndk/$NDK_VERSION"
            sleep 3
          done
          echo "NDK installation failed after three attempts" >&2
          exit 1

      - name: Generate Android launcher icon
        run: |
          python3 -m pip install --quiet Pillow
          python3 tool/generate_launcher_icon.py

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build installable debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: athr-android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
