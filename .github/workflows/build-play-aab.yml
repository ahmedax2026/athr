name: Build signed Google Play AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-play-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Bundle verified Quran text for offline use
        run: python3 tool/bundle_quran.py

      - name: Bundle Quran surah-to-page index (no page images)
        run: python3 tool/bundle_mushaf.py

      - name: Rebuild adhkar image index from approved uploaded files
        run: python3 tool/sync_azkar_manifest.py

      - name: Convert adhkar assets to verified lossless WebP
        run: |
          python3 -m pip install --quiet Pillow
          python3 tool/normalize_azkar_images.py

      - name: Verify every adhkar entry has an offline image
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('tool/azkar_data.json').read_text(encoding='utf-8'))
          manifest = json.loads(Path('assets/azkar/manifest.json').read_text(encoding='utf-8'))
          assert len(data) == len(manifest), 'Adhkar group count mismatch'
          for group, images in zip(data, manifest):
              assert len(group['items']) == len(images), 'Missing adhkar images'
              for filename in images:
                  assert (Path('assets/azkar') / filename).stat().st_size > 1000, filename
          print('Verified every adhkar entry maps to a real offline image')
          PY

      - name: Upload adhkar images for visual review
        uses: actions/upload-artifact@v4
        with:
          name: athr-azkar-images
          path: assets/azkar/
          if-no-files-found: error
          retention-days: 14

      - name: Install complete adhan recordings for native background playback
        run: python3 tool/install_adhan_android.py

      - name: Get dependencies
        run: flutter pub get

      - name: Install Android NDK with retries
        run: |
          set -euo pipefail
          NDK_VERSION="28.2.13676358"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          for attempt in 1 2 3; do
            echo "Installing NDK $NDK_VERSION (attempt $attempt/3)"
            yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" "ndk;$NDK_VERSION" || true
            if test -f "$SDK_ROOT/ndk/$NDK_VERSION/source.properties"; then
              echo "Android NDK installed and verified"
              exit 0
            fi
            rm -rf "$SDK_ROOT/ndk/$NDK_VERSION"
            sleep 3
          done
          echo "NDK installation failed after three attempts" >&2
          exit 1

      - name: Generate Android launcher icon
        run: |
          python3 -m pip install --quiet Pillow
          python3 tool/generate_launcher_icon.py

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Verify upload-key GitHub secrets are configured
        env:
          KEYSTORE_BASE64: ${{ secrets.ATHR_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ATHR_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ATHR_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ATHR_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "Missing secret ATHR_UPLOAD_KEYSTORE_BASE64"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "Missing secret ATHR_UPLOAD_STORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing secret ATHR_UPLOAD_KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing secret ATHR_UPLOAD_KEY_PASSWORD"; exit 1; }

      - name: Decode upload keystore securely
        env:
          KEYSTORE_BASE64: ${{ secrets.ATHR_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/athr-upload.jks"
          chmod 600 "$RUNNER_TEMP/athr-upload.jks"
          test -s "$RUNNER_TEMP/athr-upload.jks"

      - name: Build signed Android App Bundle for Google Play
        env:
          ATHR_UPLOAD_KEYSTORE: ${{ runner.temp }}/athr-upload.jks
          ATHR_UPLOAD_STORE_PASSWORD: ${{ secrets.ATHR_UPLOAD_STORE_PASSWORD }}
          ATHR_UPLOAD_KEY_ALIAS: ${{ secrets.ATHR_UPLOAD_KEY_ALIAS }}
          ATHR_UPLOAD_KEY_PASSWORD: ${{ secrets.ATHR_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          flutter build appbundle --release
          test -s build/app/outputs/bundle/release/app-release.aab

      - name: Upload Play-ready AAB
        uses: actions/upload-artifact@v4
        with:
          name: athr-google-play-signed-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7

      - name: Remove upload keystore from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/athr-upload.jks"
