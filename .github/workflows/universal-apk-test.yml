name: Universal APK compatibility test

on:
  workflow_dispatch:

jobs:
  universal-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Dependencies
        run: flutter pub get
      - name: Build universal APK
        run: flutter build apk --release
      - name: Verify APK architectures
        run: |
          python3 - <<'PY'
          import zipfile
          path = 'build/app/outputs/flutter-apk/app-release.apk'
          with zipfile.ZipFile(path) as z:
              libs = set(n.split('/')[1] for n in z.namelist() if n.startswith('lib/') and n.endswith('/libflutter.so'))
          print('Flutter ABIs:', sorted(libs))
          required = {'armeabi-v7a', 'arm64-v8a', 'x86_64'}
          if not required.issubset(libs):
              raise SystemExit('Missing ABIs: ' + str(required - libs))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: athr-universal-apk-test
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
