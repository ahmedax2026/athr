name: Universal APK compatibility test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  universal-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Bundle verified Quran text
        run: python3 tool/bundle_quran.py
      - name: Bundle Quran index
        run: python3 tool/bundle_mushaf.py
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Bundle offline React Quran
        run: |
          cd react_quran
          npm install --legacy-peer-deps --no-audit --no-fund
          npm run build
          python3 ../tool/inline_react_quran.py
          test -s ../assets/react_quran/index.html
      - name: Generate adhkar cards
        run: |
          python3 -m pip install --quiet Pillow
          python3 tool/bundle_azkar_cards.py
      - name: Bundle adhan recordings
        run: |
          python3 tool/bundle_adhan_audio.py
          python3 tool/install_adhan_android.py
      - name: Get dependencies
        run: flutter pub get
      - name: Generate launcher icon
        run: |
          python3 -m pip install --quiet Pillow
          python3 tool/generate_launcher_icon.py
      - name: Build universal APK
        run: flutter build apk --release
      - name: Verify APK architectures
        run: |
          python3 - <<'PY'
          import zipfile
          path = 'build/app/outputs/flutter-apk/app-release.apk'
          with zipfile.ZipFile(path) as z:
              libs = {n.split('/')[1] for n in z.namelist() if n.startswith('lib/') and n.endswith('/libflutter.so')}
          print('Flutter ABIs:', sorted(libs))
          required = {'armeabi-v7a', 'arm64-v8a', 'x86_64'}
          if not required.issubset(libs):
              raise SystemExit('Missing ABIs: ' + str(required - libs))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: athr-universal-apk-test
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
